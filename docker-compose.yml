# LAAVA Google Ads MCP - xCloud Docker + Nginx deployment.
# Secrets are provided by xCloud's private Environment File, not by Git.
services:
  google-ads-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      # Only xCloud's host Nginx should reach the MCP container directly.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      FASTMCP_HOST: "0.0.0.0"
      GOOGLE_PROJECT_ID: "${GOOGLE_PROJECT_ID:-laava-marketing-mcp}"
      GOOGLE_ADS_MCP_BASE_URL: "${GOOGLE_ADS_MCP_BASE_URL:-https://ads-mcp.laava.hu}"
      GOOGLE_ADS_MCP_OAUTH_CLIENT_ID: "${GOOGLE_ADS_MCP_OAUTH_CLIENT_ID:?OAuth Client ID required}"
      GOOGLE_ADS_MCP_OAUTH_CLIENT_SECRET: "${GOOGLE_ADS_MCP_OAUTH_CLIENT_SECRET:?OAuth Client Secret required}"
      GOOGLE_ADS_MCP_JWT_SIGNING_KEY: "${GOOGLE_ADS_MCP_JWT_SIGNING_KEY:?Persistent JWT signing key required}"
      GOOGLE_ADS_MCP_STORAGE_TYPE: "filetree"
      GOOGLE_ADS_MCP_STORAGE_PATH: "/var/lib/google-ads-mcp"
      GOOGLE_ADS_MCP_STORAGE_ENCRYPTION_KEY: "${GOOGLE_ADS_MCP_STORAGE_ENCRYPTION_KEY:?Persistent encryption key required}"
      # Optional: only set if accessing LAAVA through a manager (MCC) account.
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: "${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}"
      # Optional for configurations with Google Cloud project API-level access.
      GOOGLE_ADS_DEVELOPER_TOKEN: "${GOOGLE_ADS_DEVELOPER_TOKEN:-}"
    volumes:
      - google_ads_mcp_oauth:/var/lib/google-ads-mcp

volumes:
  google_ads_mcp_oauth:
